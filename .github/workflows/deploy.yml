name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v3

      - name: Build web app
        working-directory: web
        env:
          # Neither is secret — both are public by design (the OAuth
          # client ID and the Web Push applicationServerKey). Set as
          # plain repo variables; empty is a valid placeholder until the
          # corresponding bootstrap step has run.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          npm ci
          npm run build

      - name: Build Lambda package
        run: bash scripts/build_lambda.sh

      # Assumes GitHubActionsOffYoAssRole (infra/stacks/github_oidc_stack.py),
      # which is deployed once by hand — this workflow never creates or
      # modifies its own trust role.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::466850516129:role/GitHubActionsOffYoAssRole
          aws-region: us-east-1

      - working-directory: infra
        run: uv sync

      - name: cdk deploy
        working-directory: infra
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ALLOWED_EMAIL: cbgunter@gmail.com
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: >
          npx --yes aws-cdk@2 deploy
          OyaNetwork OyaData OyaApi OyaFrontend OyaWorkers
          --require-approval never
