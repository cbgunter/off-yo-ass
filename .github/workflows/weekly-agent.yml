name: Weekly health check

on:
  schedule:
    # Monday mornings. A plain UTC cron, not the timezone-aware scheduler
    # the nightly Garmin sync uses (infra/stacks/workers_stack.py) — this
    # is a once-a-week informational check, and an hour of DST drift on
    # it doesn't justify that extra infrastructure.
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      # Reuses the deploy role — it already has DynamoDB read access
      # (PowerUserAccess), and this workflow only reads.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::466850516129:role/GitHubActionsOffYoAssRole
          aws-region: us-east-1

      - name: Look up the DynamoDB table name
        id: table
        run: |
          name=$(aws cloudformation describe-stacks \
            --stack-name OyaData \
            --query "Stacks[0].Outputs[?OutputKey=='TableName'].OutputValue" \
            --output text)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Run the health check
        env:
          OYA_TABLE_NAME: ${{ steps.table.outputs.name }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --with anthropic,boto3 python scripts/weekly_health_check.py
