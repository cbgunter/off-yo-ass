[project]
name = "oya"
version = "0.0.1"
description = "Off Yo Ass — backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "mangum>=0.19,<0.20",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "google-auth>=2.35,<3",
  "pyjwt>=2.9,<3",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "uvicorn[standard]>=0.32",
  "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) idiom requires a call in the argument
# default — that's the framework's pattern, not a bug.
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oya"]
