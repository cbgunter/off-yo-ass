[project]
name = "oya"
version = "0.0.1"
description = "Off Yo Ass — backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "mangum>=0.19,<0.20",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "google-auth>=2.35,<3",
  "pyjwt>=2.9,<3",
  "requests>=2.32,<3",
  "garminconnect>=0.2.24,<0.3",
  "pywebpush>=2.0,<3",
  "anthropic>=1.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "uvicorn[standard]>=0.32",
  "ruff>=0.7",
  # boto3 ships in the Lambda runtime image itself (see oya/settings.py) and
  # is deliberately excluded from the deploy package by
  # scripts/build_lambda.sh — needed here only for local dev/test against a
  # real or moto-mocked DynamoDB/SSM.
  "boto3>=1.35",
  "moto[dynamodb,s3]>=5.0",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) idiom requires a call in the argument
# default — that's the framework's pattern, not a bug.
ignore = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oya"]
